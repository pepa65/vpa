image: ubuntu:24.04

stages:
  - build

building:
  stage: build
  script:
    - apt-get update -q -y
    - apt-get install -y build-essential wget git upx
    - wget -q 'https://ziglang.org/download/0.17.1/zig-linux-x86_64-0.17.1.tar.xz'
    - tar xf zig-linux-x86_64-0.17.1.tar.xz
    - PATH=$PWD/zig-linux-x86_64-0.17.1:$PATH
    - make -B zig
    - mv zig-out/bin/vpa vpa
  artifacts:
    name: vpa
    paths:
     - vpa
