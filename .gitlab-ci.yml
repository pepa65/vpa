image: ubuntu:26.04

stages:
  - build

building:
  stage: build
  variables:
    ZIG_VERSION: "0.17.1"
  script:
    - apt-get update
    - apt-get install -y build-essential ca-certificates wget git upx-ucl xz-utils
    - ZIG_DIR="zig-x86_64-linux-${ZIG_VERSION}"
    - wget -nv "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_DIR}.tar.xz"
    - tar -xJf "${ZIG_DIR}.tar.xz"
    - export PATH="$PWD/$ZIG_DIR:$PATH"
    - zig version
    - make -B zig
    - mv zig-out/bin/vpa vpa
  artifacts:
    name: vpa
    paths:
      - vpa
